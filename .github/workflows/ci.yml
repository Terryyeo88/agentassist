# CI Workflow for SAP B1 AI Agent
#
# This workflow runs automatically whenever code is pushed to key branches or a
# pull request is opened against master. It installs dependencies, checks the
# code for syntax errors with flake8, then runs the full pytest test suite.
#
# Before this workflow can pass, you must add ANTHROPIC_API_KEY as a secret in:
# GitHub → Settings → Secrets and variables → Actions → New repository secret

# The name shown in the GitHub Actions UI for this workflow
name: Python CI

# Defines when this workflow is triggered
on:
  push:
    # Run on every push to these branches so issues are caught during development,
    # not just at PR time. "t*" covers feature branches like t2.7-reasoning-reg2627.
    branches: [ "master", "Add-CI", "t*" ]
  pull_request:
    # Also run when a pull request is opened or updated against master
    branches: [ "master" ]

jobs:
  build:
    # Run the job on a fresh Ubuntu virtual machine hosted by GitHub
    runs-on: ubuntu-latest

    # Harden EVERY pip invocation in this job (the requirements.txt install AND the
    # ad-hoc `pip install flake8` in the lint step) against transient runner-network
    # drops — the large claude-agent-sdk wheel intermittently dies mid-download with
    # IncompleteRead/ProtocolError. These env vars are read only by pip: a dropped
    # download retries (8 attempts, 120s socket timeout) instead of failing the job.
    # PIP_PROGRESS_BAR=off keeps retry/error output readable in the log.
    env:
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_RETRIES: "8"
      PIP_PROGRESS_BAR: "off"

    steps:
    # Check out the repository code onto the runner so subsequent steps can access it
    - uses: actions/checkout@v4

    # Install the specified Python version on the runner
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Upgrade the installer toolchain, then install all project dependencies.
    # --prefer-binary: take a published wheel over an sdist wherever both exist —
    # NEVER --no-deps; full transitive dependency resolution is preserved. (The
    # claude-agent-sdk pin already resolves to its manylinux wheel on this runner,
    # so this flag changes no resolved package today; it only guards against a
    # future sdist fallback. Retry/timeout env is job-level above.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --prefer-binary -r requirements.txt

    # Install flake8 and run two passes:
    #   Pass 1: fail the build immediately on syntax errors or undefined names (E9, F63, F7, F82)
    #   Pass 2: report style warnings (complexity, line length) as informational only (exit-zero = never fails)
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Enforce the orchestrator/ import-isolation rule: orchestrator/ must not import
    # anthropic, reasoning, documents, agent, or engine. Mirrors docs/merge-gates.md Gate a.
    # agent/ is ALLOWED the SDK (lazy) — this check is scoped to orchestrator/ only.
    # T5.1: engine/ added to Check 2 — dependency direction is engine->orchestrator, never reverse.
    - name: Import-scan — orchestrator/ must not import anthropic, reasoning, documents, agent, or engine
      run: |
        if grep -rnE "^[[:space:]]*(import[[:space:]]+anthropic|from[[:space:]]+anthropic[[:space:]]+import)" orchestrator/; then
          echo "FAIL: anthropic import found in orchestrator/"; exit 1
        fi
        if grep -rnE "^[[:space:]]*(import[[:space:]]+(reasoning|documents|agent|engine)|from[[:space:]]+(reasoning|documents|agent|engine)[[:space:]]+import)" orchestrator/; then
          echo "FAIL: reasoning/documents/agent/engine import found in orchestrator/"; exit 1
        fi
        echo "PASS: orchestrator/ import-scan clean"

    # Run the full pytest test suite.
    # ANTHROPIC_API_KEY is injected from GitHub Secrets so tests that reference
    # the Anthropic API do not fail with a "key not set" error.
    - name: Test with pytest
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Add the repo root to Python's module search path so imports like
        # "from audit_bundle.canonical import ..." resolve correctly in CI
        PYTHONPATH: .
      run: |
        pytest -n auto
